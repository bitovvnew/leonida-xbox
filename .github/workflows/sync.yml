name: mirror-sync
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/unlock.mjs
        env:
          LEONIDA_KEY: ${{ secrets.LEONIDA_KEY }}
      - run: |
          git config user.name "leonida-ci"
          git config user.email "leonida-ci@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "devlog $(date -u +%F)"
          git push
